<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b131b">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Campo · Hub ECON</title>
<style>
  :root{--bg:#0b131b;--panel:#131c26;--panel2:#1b2633;--line:#293848;--ink:#f0f4f8;
        --muted:#798d9f;--acento:#38719f;--ok:#2b7a59;--warn:#c28830;--crit:#a33d3d;
        --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:0 14px 32px;max-width:560px;margin-inline:auto}
  header{padding:16px 0 12px;border-bottom:1px solid var(--line);display:flex;
         justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:9}
  h1{margin:0;font-size:17px;letter-spacing:-.01em}
  header span{font:11px/1 var(--mono);color:var(--muted);display:block;margin-top:3px}
  #red{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:4px 8px;border:1px solid var(--line);white-space:nowrap;border-radius:4px}
  #red.linea{color:var(--ok);border-color:var(--ok)}
  #red.sin{color:var(--warn);border-color:var(--warn)}
  h2{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 9px}
  label{display:block;font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
        padding:11px;font:15px 'Plus Jakarta Sans',system-ui,sans-serif;border-radius:6px}
  textarea{min-height:70px;resize:vertical}
  button{width:100%;margin-top:16px;padding:14px;background:var(--acento);color:#ffffff;border:0;
         font-weight:600;font-size:15px;cursor:pointer;border-radius:6px}
  button:disabled{background:var(--panel2);color:var(--muted)}
  button.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);margin-top:8px;border-radius:6px}
  .cola{list-style:none;padding:0;margin:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
  .cola li{background:var(--panel);padding:9px 11px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px}
  .cola .est{font:9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:3px 6px;flex:none;align-self:center}
  .est.pendiente{background:#332c12;color:var(--warn)}
  .est.enviado{background:#17362a;color:var(--ok)}
  .est.error{background:#381e1b;color:var(--crit)}
  .vacio{color:var(--muted);font-style:italic;background:var(--panel);padding:11px;font-size:13px}
  .aviso{background:var(--panel2);border-left:2px solid var(--acento);padding:10px 12px;font-size:12.5px;margin:14px 0 0}
  .aviso b{color:var(--acento)}
</style>
</head>
<body>
<header>
  <div><h1>Captura de campo</h1><span>Hub de Operaciones · Grupo ECON</span></div>
  <span id="red" class="sin">sin señal</span>
</header>

<h2>Nuevo registro</h2>
<label for="tipo">Tipo de registro</label>
<select id="tipo">
  <option value="inspeccion">Inspección preoperacional</option>
  <option value="diesel">Vale de diésel</option>
  <option value="falla">Reporte de falla</option>
  <option value="turno">Cambio de turno</option>
</select>

<label for="asset">Máquina</label>
<input id="asset" placeholder="CAT-320-04" autocomplete="off">

<label for="horas">Horómetro (h)</label>
<input id="horas" type="number" step="0.1" inputmode="decimal" placeholder="4520.3">

<label for="galones">Galones de diésel (solo si es vale)</label>
<input id="galones" type="number" step="0.1" inputmode="decimal" placeholder="120">

<label for="nota">Observaciones</label>
<textarea id="nota" placeholder="Se reventó la manguera hidráulica del brazo…"></textarea>

<button id="guardar">Guardar registro</button>
<button id="sincronizar" class="sec">Sincronizar ahora</button>

<div class="aviso">
  <b>Funciona sin señal.</b> El registro se guarda en el teléfono y se sincroniza
  solo cuando vuelve la cobertura. Cada mutación lleva una clave única, así que
  reenviarla nunca duplica el dato en el Hub.
</div>

<h2>Cola local · <span id="cuenta">0</span></h2>
<ul class="cola" id="cola"></ul>

<script src="app.js"></script>
</body>
</html>
