<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Grupo ECON — Hub de Operaciones & Demostración PEA</title>
  <meta name="description" content="Plataforma de Operaciones de Maquinaria, Concreto y Conciliación Silos Startrack-Nexus conforme a ISO 15143-3 en El Salvador">
  
  <!-- Google Fonts: Plus Jakarta Sans (Amigable, Humana, Moderna) & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            // Mapeo armónico de azul acero frío y pizarra
            gold: {
              400: '#437aa7',
              500: '#2e5b82',
              600: '#234563',
            },
            steel: {
              50: '#f0f5fa',
              100: '#e2ebf4',
              200: '#c5d8ea',
              300: '#9ec1dc',
              400: '#699cc4',
              500: '#437aa7',
              600: '#2e5b82',
              700: '#234563',
              800: '#1c344a',
              900: '#142535',
            },
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Estilos Custom: Paleta Proporcional de Azules Fríos Pizarra & Acero -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#edf2f7] text-[#1e293b] font-sans flex flex-col min-h-screen antialiased selection:bg-[#2e5b82] selection:text-white overflow-x-hidden">

  <!-- Barra Superior Global de Plataformas y Estado PEA -->
  <div id="global-portal-bar" class="sticky top-0 z-50"></div>

  <!-- Plataforma 1: Hub de Operaciones — Grupo ECON (Paleta Azul Frío Pizarra & Acero) -->
  <div id="platform-hub" class="flex-1 flex flex-col">
    <!-- Header Superior con Menú de Módulos Desplegable -->
    <div id="header-root"></div>

    <!-- Contenedor Principal de Vistas del Hub -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6">
      <div id="tab-dashboard" class="transition-opacity duration-200"></div>
      <div id="tab-map" class="hidden transition-opacity duration-200"></div>
      <div id="tab-fleet" class="hidden transition-opacity duration-200"></div>
      <div id="tab-reconciliation" class="hidden transition-opacity duration-200"></div>
      <div id="tab-materials" class="hidden transition-opacity duration-200"></div>
      <div id="tab-dispatch" class="hidden transition-opacity duration-200"></div>
      <div id="tab-connectors" class="hidden transition-opacity duration-200"></div>
    </main>
  </div>

  <!-- Plataforma 2: Mock Startrack Telematics (Azul Acero Telemático) -->
  <div id="platform-startrack" class="hidden flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6"></div>

  <!-- Plataforma 3: Mock Nexus ERP (Azul Pizarra Corporativo) -->
  <div id="platform-nexus" class="hidden flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6"></div>

  <!-- Footer Editorial Limpio & Amigable -->
  <footer class="border-t border-[#d4dfe8] bg-white py-8 text-xs text-[#64748b] mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
      <div>
        <span class="font-sans font-bold text-base text-[#1e293b] tracking-tight block">GRUPO ECON</span>
        <span class="gl-subtitle text-[9px] text-[#2e5b82]">HUB DE OPERACIONES & CONCILIACIÓN • EL SALVADOR</span>
      </div>
      <div class="text-[11px] text-[#64748b] max-w-md">
        Norma ISO 15143-3 (AEMP 2.0) • Demostración de Enlace e Interoperabilidad entre Nexus ERP y Startrack Telematics
      </div>
    </div>
  </footer>

  <!-- Contenedor de Modales Dinámicos -->
  <div id="modal-root"></div>

  <!-- Contenedor de Notificaciones Toast -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Scripts de la Aplicación -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/globalPortalBar.js"></script>
  <script src="js/components/startrackMock.js"></script>
  <script src="js/components/nexusMock.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/fleetMap.js"></script>
  <script src="js/components/fleetList.js"></script>
  <script src="js/components/reconciliation.js"></script>
  <script src="js/components/materials.js"></script>
  <script src="js/components/dispatch.js"></script>
  <script src="js/components/connectors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
